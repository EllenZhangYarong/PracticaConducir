 wg.beginPath();wg.moveTo(20,r-18);wg.lineTo(6,r);wg.lineTo(20,r+18);wg.moveTo(s-20,r-18);wg.lineTo(s-6,r);wg.lineTo(s-20,r+18);wg.stroke();
 wg.save();wg.translate(r,r);wg.rotate(wa*Math.PI/180);

function wAng(e){const b=wc.getBoundingClientRect();return Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2))*180/Math.PI}
